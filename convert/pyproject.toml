[project]
name = "nls-convert"
version = "0.1.0"
description = "Convert local Llama (HF-format) weights into a GGUF for nls, using PyTorch + llama.cpp's converter."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "transformers>=4.45",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "safetensors>=0.4",
    # Llama 3.x original checkpoints use a tiktoken-based tokenizer; needed by
    # the legacy converter for the Meta-direct (non-HuggingFace) path.
    "tiktoken>=0.7",
    "blobfile>=2.1",
    # gguf is pinned to the same llama.cpp build as the brew-installed runtime
    # so the converter and the gguf writer stay in lockstep.
    "gguf",
]

# Pin gguf to the exact llama.cpp build that ships with the runtime (b10470).
# GitHub, not Hugging Face.
[tool.uv.sources]
gguf = { git = "https://github.com/ggml-org/llama.cpp", subdirectory = "gguf-py", tag = "b10470" }

# This folder is a tool, not an installable package: only manage dependencies.
[tool.uv]
package = false
