# Example nsh configuration.
#
# nsh is configured entirely through environment variables. Copy the lines you
# need into your ~/.zshrc, or `source` this file after editing the paths.

# Optional: path to apfel. By default nsh finds it on your PATH.
# export NSH_APFEL="/opt/homebrew/bin/apfel"

# The system prompt lives at ~/.nsh/system.txt (written by the installer).
# Edit that file directly to change how nsh generates commands.

# Optional tuning.
# export NSH_MAX_TOKENS=150     # max output tokens
# export NSH_TEMPERATURE=0      # sampling temperature; 0 = deterministic
# export NSH_APFEL_ARGS=""      # extra args passed through to apfel

# Optional: show apfel diagnostics on stderr for debugging.
# export NSH_DEBUG=1
