# Example nls configuration.
#
# nls is configured entirely through environment variables. Copy the lines you
# need into your ~/.zshrc, or `source` this file after editing the paths.

# Required: path to a local GGUF instruction model.
export NLS_MODEL="$HOME/.local/share/nls/model.gguf"

# Optional: path to llama-simple. By default nls finds it on your PATH.
# export NLS_LLAMA_SIMPLE="/opt/homebrew/bin/llama-simple"

# Optional: use a custom system prompt file instead of the built-in one.
# export NLS_SYSTEM_PROMPT="$HOME/.config/nls/system.txt"

# Optional tuning.
# export NLS_MAX_TOKENS=150     # max output tokens
# export NLS_NGL=99             # GPU layers to offload (Metal on Apple Silicon)
# export NLS_LLAMA_ARGS=""      # extra args passed through to llama-simple

# Optional: show llama-simple diagnostics on stderr for debugging.
# export NLS_DEBUG=1
