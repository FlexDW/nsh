name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (ignored if version_override is set)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version_override:
        description: 'Override version (e.g., v1.2.3) - skips automatic bump'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    # The macOS arm64 binary is built locally and committed to the repo; this
    # workflow only packages it into a GitHub Release, so a cheap Linux runner
    # is fine.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        if: ${{ !inputs.version_override }}
        run: |
          CURRENT_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)
          if [ -z "$CURRENT_TAG" ]; then
            echo "Error: No semantic version tags found (v*.*.*). Use version_override for the first release." >&2
            exit 1
          fi
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_TAG"

      - name: Calculate new version from bump
        id: bumped
        if: ${{ !inputs.version_override }}
        run: |
          NEW_TAG=$(./scripts/generate-version.py "${{ steps.current.outputs.tag }}" "${{ inputs.bump }}")
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $NEW_TAG"

      - name: Use override version
        id: override
        if: ${{ inputs.version_override }}
        run: |
          VERSION="${{ inputs.version_override }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Override version must match format v#.#.# (e.g., v1.2.3). Got: $VERSION" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using override version: $VERSION"

      - name: Resolve version
        id: version
        run: |
          TAG="${{ steps.bumped.outputs.tag || steps.override.outputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Package prebuilt binary
        run: |
          BIN=dist/nsh-macos-arm64
          if [ ! -f "$BIN" ]; then
            echo "Error: $BIN not found. Build it locally with 'make dist' and commit it before releasing." >&2
            exit 1
          fi
          cp "$BIN" nsh-macos-arm64
          chmod +x nsh-macos-arm64
          sha256sum nsh-macos-arm64 > nsh-macos-arm64.sha256
          cat nsh-macos-arm64.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: |
            nsh-macos-arm64
            nsh-macos-arm64.sha256
            prompts/system.txt
            shell/nsh.zsh
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
